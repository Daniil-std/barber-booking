name: CI
"on":
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: barber_ci
          POSTGRES_USER: barber_ci
          POSTGRES_PASSWORD: ci-only-not-a-production-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U barber_ci -d barber_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-disposable-key-never-use-in-production-0123456789
      DJANGO_DEBUG: "True"
      POSTGRES_DB: barber_ci
      POSTGRES_USER: barber_ci
      POSTGRES_PASSWORD: ci-only-not-a-production-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pip check
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py collectstatic --noinput
      - run: python backend/manage.py test studio.tests --noinput
      - run: python backend/manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "False"
          DJANGO_HTTPS: "True"
          DJANGO_ALLOWED_HOSTS: demo.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://demo.example.test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run format:check
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: python scripts/create_local_env.py
      - run: docker compose --env-file backend/.env config --quiet
      - run: docker compose --env-file backend/.env up --build -d --wait
      - run: docker compose --env-file backend/.env exec -T web python manage.py seed_demo
      - run: python scripts/smoke_http.py http://127.0.0.1:8080 --exercise-bookings
      - if: always()
        run: docker compose --env-file backend/.env logs --no-color web
      - if: always()
        run: docker compose --env-file backend/.env down -v
