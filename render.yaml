# Free demo deployment. Review Render's Free tier limits before creating resources.
services:
  - type: web
    name: barber-booking-web
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    autoDeployTrigger: "off"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_HTTPS
        value: "True"
      - key: DJANGO_TRUST_PROXY
        value: "True"
      - key: DATABASE_SSL_REQUIRE
        value: "True"
      # start.py runs this idempotent command after every successful migration.
      # Set to "False" after the first deploy to stop refreshing demo catalog data.
      - key: SEED_DEMO_DATA
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: "127.0.0.1,localhost"
      # RENDER_EXTERNAL_HOSTNAME is supplied by Render. Django adds that exact
      # hostname and its HTTPS CSRF origin, without allowing wildcards.
      - key: DATABASE_URL
        fromDatabase:
          name: barber-booking-db
          property: connectionString
databases:
  - name: barber-booking-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    databaseName: barber_booking
    user: barber_booking
    ipAllowList: []
