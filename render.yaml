# Deployment template only. These plans incur charges; review in Render before applying.
services:
  - type: web
    name: barber-booking-web
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    autoDeployTrigger: "off"
    preDeployCommand: python manage.py migrate --noinput
    initialDeployHook: python manage.py seed_demo
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_HTTPS
        value: "True"
      - key: DJANGO_TRUST_PROXY
        value: "True"
      - key: DATABASE_SSL_REQUIRE
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: "127.0.0.1,localhost"
      # RENDER_EXTERNAL_HOSTNAME is supplied by Render. Django adds that exact
      # hostname and its HTTPS CSRF origin, without allowing wildcards.
      - key: DATABASE_URL
        fromDatabase:
          name: barber-booking-db
          property: connectionString
databases:
  - name: barber-booking-db
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "17"
    databaseName: barber_booking
    user: barber_booking
    ipAllowList: []
